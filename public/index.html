  <head>

    <!-- Twitter Card -->

    <meta name="twitter:title" content="Cards · shmemcat">
    <meta name="twitter:description" content="Hearts, Euchre, Golf, and Hand &amp; Foot, by shmemcat.">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/EBGaramond-Variable.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/assets/fonts/TerminalDosis-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/assets/fonts/Fraunces-Variable.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/assets/fonts/Bitter-Variable.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme.js"></script>
    <script>
      (() => {
        if (!document.fonts) return;
        const root = document.documentElement;
        root.classList.add('fonts-loading');
        const reveal = () => {
          clearTimeout(timeout);
          root.classList.remove('fonts-loading');
        };
        // Keep the page usable if a font download stalls or fails.
        const timeout = setTimeout(reveal, 3000);
        Promise.allSettled([
          document.fonts.load('700 1em "EB Garamond"'),
          document.fonts.load('900 1em "Terminal Dosis"'),
          document.fonts.load('700 1em "Fraunces"'),
          document.fonts.load('600 1em "Bitter"'),
        ]).then(reveal);
      })();
    </script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#games">Skip to games</a>
    <div class="site-shell hub-shell">
      <nav class="site-header" aria-label="Main navigation">
        <span aria-hidden="true"></span>
        <div class="nav-actions">

          </button>
          <a class="nav-account" href="/user/" aria-label="Login and user settings">
            <span class="nav-icon user-icon" aria-hidden="true"></span>
            <span>Guest</span>
          </a>
        </div>
      </nav>
      <main class="hub">
        <h1>Cards</h1>
        <nav class="games" id="games" aria-label="Card games">
          <a class="game-choice game-hearts" href="/hearts/" aria-label="Play Hearts">
            <div class="game-wordmark">
              <span class="game-logo" aria-hidden="true"></span>
              <h2>Hearts</h2>
            </div>
            <span class="play-button" aria-hidden="true"><span class="button-shine"></span>Play</span>
          </a>
          <a class="game-choice game-euchre" href="/euchre/" aria-label="Play Euchre">
            <div class="game-wordmark">
              <span class="game-logo" aria-hidden="true"></span>
              <h2>Euchre</h2>
            </div>
            <span class="play-button" aria-hidden="true"><span class="button-shine"></span>Play</span>
          </a>
          <a class="game-choice game-golf" href="/golf/" aria-label="Play Golf">
            <div class="game-wordmark">
              <span class="game-logo" aria-hidden="true"></span>
              <h2>Golf</h2>
            </div>
            <span class="play-button" aria-hidden="true"><span class="button-shine"></span>Play</span>
          </a>
          <a class="game-choice game-handandfoot" href="/hand-and-foot/" aria-label="Play Hand and Foot">
            <div class="game-wordmark">
              <span class="game-logo" aria-hidden="true"></span>
              <h2>Hand &amp; Foot</h2>
            </div>
            <span class="play-button" aria-hidden="true"><span class="button-shine"></span>Play</span>
          </a>
        </nav>
      </main>
      <footer>
        <a class="creator" href="https://github.com/shmemcat" aria-label="shmemcat on GitHub">
          <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
          shmemcat
          <span class="sparkle sparkle-two" aria-hidden="true">✦</span>
          <span class="sparkle sparkle-three" aria-hidden="true">✦</span>
          <span class="sparkle sparkle-four" aria-hidden="true">✦</span>
        </a>
      </footer>
    </div>
  </body>
</html>
