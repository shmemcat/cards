name: Publish legacy Cards images (manual only)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing legacy vMAJOR.MINOR.PATCH tag to publish
        type: string
        required: true
      acknowledge_legacy:
        description: Publish retained legacy images without deploying or updating latest
        type: boolean
        required: true
        default: false

concurrency:
  group: cards-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require explicit legacy publication
        env:
          ACKNOWLEDGE_LEGACY: ${{ inputs.acknowledge_legacy }}
        run: |
          [[ "$ACKNOWLEDGE_LEGACY" == "true" ]] || { echo "::error::Confirm legacy publication explicitly."; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}
      - name: Validate release
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]'
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the hub
        run: |
          npm run build
          node --check scripts/check-deployment.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing legacy image tags
        run: |
          shopt -s nocasematch
          for name in cards-web; do
            image="ghcr.io/shmemcat/$name:$RELEASE_TAG"
            if output=$(docker buildx imagetools inspect "$image" 2>&1); then
              echo "::error::Legacy version already exists: $image"
              exit 1
            elif [[ ! "$output" =~ (manifest[[:space:]]unknown|not[[:space:]]found|404) ]] || [[ "$output" =~ (unauthorized|denied|forbidden|timeout|timed[[:space:]]out|connection|no[[:space:]]such[[:space:]]host) ]]; then
              echo "::error::Cannot establish that legacy image is unused: $image"
              exit 1
            fi
          done
      - name: Build the gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: ghcr.io/shmemcat/cards-web:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/shmemcat/cards
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Check and publish the release
        run: |
          image="ghcr.io/shmemcat/cards-web:$RELEASE_TAG"
          docker run --rm "$image" nginx -t
          docker push "$image"
