name: Release immutable Cards gateway

on:
  push:
    tags: ["gateway-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing gateway-vMAJOR.MINOR.PATCH tag to publish without promotion
        required: true

concurrency:
  group: cards-gateway-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate the gateway tag and record its source
        id: revision
        run: |
          [[ "$RELEASE_TAG" =~ ^gateway-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check gateway and release contracts
        run: |
          npm run build
          npm run test:release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing versioned gateway
        run: node scripts/component-release.mjs --gateway check "$RELEASE_TAG"
      - name: Build the gateway without promoting it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: ghcr.io/shmemcat/cards-web:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/shmemcat/cards
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Validate and publish the immutable gateway
        run: |
          image="ghcr.io/shmemcat/cards-web:$RELEASE_TAG"
          docker run --rm "$image" nginx -t
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
          node scripts/component-release.mjs --gateway record "$RELEASE_TAG" "${{ steps.revision.outputs.sha }}" "$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: cards-gateway-${{ env.RELEASE_TAG }}
          path: release-artifacts/cards-gateway.json
          if-no-files-found: error
