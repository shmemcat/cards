# Compatibility aliases all point to the combined backend during this slice.
# Private service interfaces are never reachable through any public alias.
if ($uri ~ "(^|/)_internal(/|$)") { return 404; }
# Reject nested path escapes before a second proxy can decode them again.
if ($uri ~* "%[0-9a-f]{2}") { return 404; }
location ^~ /api/hearts/ {
    set $cards_api cards-api:5000;
    rewrite ^/api/hearts/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location ^~ /api/euchre/ {
    set $cards_api cards-api:5000;
    rewrite ^/api/euchre/(.*)$ /account/euchre/$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
# Keep this game-owned alias more specific than the shared account prefix.
location ^~ /api/account/euchre/ {
    set $cards_api cards-api:5000;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location ^~ /api/ {
    set $cards_api cards-api:5000;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
# Slashless routes avoid redirects on polling POSTs. These longer prefixes take
# precedence over the /hearts/ and /euchre/ web application proxies.
location = /hearts/socket.io {
    set $cards_api cards-api:5000;
    rewrite ^ /socket.io/ break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /hearts/socket.io/ {
    set $cards_api cards-api:5000;
    rewrite ^/hearts/(.*)$ /$1 break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location = /euchre/socket.io {
    set $cards_api cards-api:5000;
    rewrite ^ /socket.io/ break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /euchre/socket.io/ {
    set $cards_api cards-api:5000;
    rewrite ^/euchre/(.*)$ /$1 break;
    include /etc/nginx/cards-socket-proxy.conf;
}
# Retain old clients throughout the migration and the documented support window.
location = /socket.io {
    set $cards_api cards-api:5000;
    rewrite ^ /socket.io/ break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /socket.io/ {
    set $cards_api cards-api:5000;
    include /etc/nginx/cards-socket-proxy.conf;
}
