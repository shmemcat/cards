# Opt-in rehearsal only. The production proxy.conf retains the combined target.
if ($uri ~ "(^|/)_internal(/|$)") { return 404; }
if ($uri ~* "%[0-9a-f]{2}") { return 404; }
location ^~ /api/golf/ {
    set $cards_api golf:5003;
    include /etc/nginx/cards-api-proxy.conf;
}
location ^~ /api/hand-and-foot/ {
    set $cards_api handandfoot:5104;
    include /etc/nginx/cards-api-proxy.conf;
}
location = /hand-and-foot/socket.io {
    set $cards_api handandfoot:5104;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /hand-and-foot/socket.io/ {
    set $cards_api handandfoot:5104;
    include /etc/nginx/cards-socket-proxy.conf;
}
location = /golf/socket.io {
    set $cards_api golf:5003;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /golf/socket.io/ {
    set $cards_api golf:5003;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /api/hearts/ {
    set $cards_api hearts:5001;
    rewrite ^/api/hearts/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location ^~ /api/euchre/ {
    set $cards_api euchre:5002;
    rewrite ^/api/euchre/(.*)$ /account/euchre/$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location ^~ /api/account/euchre/ {
    set $cards_api euchre:5002;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location ^~ /api/account/ {
    set $cards_api accounts:5001;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location ~ ^/api/(games|lobbies|stats|preferences|leaderboard)(/|$) {
    set $cards_api hearts:5001;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location /api/ {
    set $cards_api accounts:5001;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/cards-api-proxy.conf;
}
location = /hearts/socket.io {
    set $cards_api hearts:5001;
    rewrite ^ /socket.io/ break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /hearts/socket.io/ {
    set $cards_api hearts:5001;
    rewrite ^/hearts/(.*)$ /$1 break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location = /euchre/socket.io {
    set $cards_api euchre:5002;
    rewrite ^ /socket.io/ break;
    include /etc/nginx/cards-socket-proxy.conf;
}
location ^~ /euchre/socket.io/ {
    set $cards_api euchre:5002;
    rewrite ^/euchre/(.*)$ /$1 break;
    include /etc/nginx/cards-socket-proxy.conf;
}
# A single old transport cannot be routed by namespace across two new servers.
location = /socket.io { return 426 '{"code":"CLIENT_RELOAD_REQUIRED"}'; }
location ^~ /socket.io/ { return 426 '{"code":"CLIENT_RELOAD_REQUIRED"}'; }
