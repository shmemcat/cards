map $http_upgrade $cards_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080 default_server;
    server_name cards.shmem.dev;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-cache always;

    include /etc/nginx/cards-proxy.conf;

    location = /hearts { return 308 /hearts/$is_args$args; }
    location = /euchre { return 308 /euchre/$is_args$args; }
    location = /user { return 308 /user/$is_args$args; }
    location = /verify-email { return 302 /user/?view=verify&$args; }
    location = /reset-password { return 302 /user/?view=reset&$args; }
    location = /hearts/verify-email { return 302 /user/?view=verify&$args; }
    location = /hearts/reset-password { return 302 /user/?view=reset&$args; }
    location = /hearts/register { return 302 /user/?view=register; }
    location = /hearts/forgot-password { return 302 /user/?view=recover; }
    location = /hearts/resend-verification { return 302 /user/?view=resend; }

    # Development mail and hidden files must never be published.
    location ^~ /__dev/ { return 404; }
    location ~ /\. { return 404; }
    # Missing assets are real 404s, rather than a game's HTML fallback.
    location ~* \.(?:js|css|svg|png|jpe?g|webp|ico|ttf|woff2?|mp3|ogg|json|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }
    location /hearts/ { try_files $uri $uri/ /hearts/index.html; }
    location /euchre/ { try_files $uri $uri/ /euchre/index.html; }
    location /user/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
}

# The TLS edge must forward the original Host header. Retain HTTPS certificates
# for these hosts even after redirecting them. API/socket exceptions let already
# open legacy clients finish their requests during the transition.
server {
    listen 8080;
    server_name hearts.shmem.dev;
    include /etc/nginx/cards-proxy.conf;
    location = /verify-email { return 302 https://cards.shmem.dev/user/?view=verify&$args; }
    location = /reset-password { return 302 https://cards.shmem.dev/user/?view=reset&$args; }
    location / { return 308 https://cards.shmem.dev/hearts$request_uri; }
}
server {
    listen 8080;
    server_name euchre.shmem.dev;
    include /etc/nginx/cards-proxy.conf;
    location / { return 308 https://cards.shmem.dev/euchre$request_uri; }
}
